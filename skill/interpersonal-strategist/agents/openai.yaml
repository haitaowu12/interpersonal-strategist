interface:
  display_name: "Interpersonal Strategist"
  short_description: "Interpersonal strategy across work and relationships"
  default_prompt: "Use $interpersonal-strategist as my thinking partner. Build context before advising when key facts are missing: ask one focused question, wait for my answer, and challenge assumptions respectfully. Then help me choose a move, find natural words, rehearse if useful, and update from the result. Honor quick mode."
policy:
  allow_implicit_invocation: false
