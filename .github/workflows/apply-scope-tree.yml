name: Apply validated relationship scope tree

on:
  push:
    branches:
      - agent/broaden-relationship-scope
    paths:
      - .github/workflows/apply-scope-tree.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-validated-relationship-scope
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/broaden-relationship-scope
          fetch-depth: 0

      - name: Reconstruct and verify validated object pack
        env:
          B64_SHA256: cbcbd9c06a2d3d75f501f6ab4c4e602d05692ee81cafe3646bbbf5d486b0a56f
          PACK_SHA256: b7ccc0a3b461817fe273728c6efe10090cf7420bed4ac3e8b20a63f6a2be734f
          TREE_SHA: 0e3ea035f954485c6e34e67a567254316c9bd37b
        run: |
          set -euo pipefail
          cat \
            .scope-pack.b64.00 \
            .scope-pack.b64.01 \
            .scope-pack.b64.02 \
            .scope-pack.b64.03 \
            .scope-pack.b64.04 \
            .scope-pack.b64.05 \
            .scope-pack.b64.06 \
            .scope-pack.b64.07 \
            > /tmp/scope.pack.b64
          echo "${B64_SHA256}  /tmp/scope.pack.b64" | sha256sum -c -
          base64 --decode /tmp/scope.pack.b64 > /tmp/scope.pack
          echo "${PACK_SHA256}  /tmp/scope.pack" | sha256sum -c -
          git index-pack --fix-thin --stdin < /tmp/scope.pack
          git cat-file -e "${TREE_SHA}^{tree}"

      - name: Publish exact validated tree
        env:
          BRANCH: agent/broaden-relationship-scope
          TREE_SHA: 0e3ea035f954485c6e34e67a567254316c9bd37b
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          parent="$(git rev-parse HEAD)"
          commit="$(printf '%s\n\n%s\n' \
            'Expand interpersonal scope across relationships' \
            'Include dating, romance, intimacy, breakups, reconciliation, and diverse relationship structures while retaining consent, safety, privacy, and authority safeguards.' \
            | git commit-tree "${TREE_SHA}" -p "${parent}")"
          git reset --hard "${commit}"
          git push origin "${commit}:refs/heads/${BRANCH}"
          echo "Published ${commit} with tree ${TREE_SHA}"

      - name: Dispatch canonical exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: agent/broaden-relationship-scope
        run: gh workflow run ci.yml --ref "${BRANCH}"
