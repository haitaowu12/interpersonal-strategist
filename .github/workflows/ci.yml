name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

concurrency:
  group: interpersonal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python3 -m compileall -q scripts evals tests

      - name: Validate repository and release governance
        run: python3 scripts/validate.py

      - name: Validate evidence registry offline
        run: python3 scripts/check_evidence.py --offline

      - name: Validate evaluation fixtures
        run: python3 evals/run.py validate-fixtures

      - name: Validate persona and conversation regression fixtures
        run: python3 evals/persona_conversation.py validate

      - name: Validate inclusive relationship regression fixtures
        run: python3 evals/relationship_scope.py validate

      - name: Validate interactive context scenarios
        run: python3 evals/interactive_context.py validate

      - name: Run unit and mutation tests
        run: python3 -m unittest discover -s tests -v

      - name: Prepare deterministic skill and no-skill manifests
        run: |
          mkdir -p build
          python3 evals/run.py prepare --condition skill --output build/skill-prompts.jsonl
          python3 evals/run.py prepare --condition no-skill --output build/no-skill-prompts.jsonl
          python3 evals/persona_conversation.py prepare \
            --condition skill \
            --output build/persona-conversation-skill-prompts.jsonl
          python3 evals/persona_conversation.py prepare \
            --condition no-skill \
            --output build/persona-conversation-no-skill-prompts.jsonl
          python3 evals/relationship_scope.py prepare \
            --condition skill \
            --output build/relationship-scope-skill-prompts.jsonl
          python3 evals/relationship_scope.py prepare \
            --condition no-skill \
            --output build/relationship-scope-no-skill-prompts.jsonl

      - name: Freeze development run plan and check the no-call execution path
        run: |
          python3 evals/run.py prepare --condition short-prompt --output build/short-prompt.jsonl
          python3 evals/run.py plan --manifest build/skill-prompts.jsonl --manifest build/no-skill-prompts.jsonl --output build/run-plan.json
          python3 evals/execute.py --plan build/run-plan.json --manifest build/skill-prompts.jsonl --manifest build/no-skill-prompts.jsonl --output build/not-executed.jsonl
          test ! -e build/not-executed.jsonl

      - name: Prepare isolated interactive packets
        run: |
          python3 evals/interactive_context.py prepare --condition skill --output build/interactive-skill
          python3 evals/interactive_context.py prepare --condition no-skill --output build/interactive-no-skill

      - name: Build deterministic release
        run: python3 scripts/package.py

      - name: Record exact-subject build provenance
        run: python3 scripts/build_provenance.py --output build/build-provenance.json

      - name: Export exact source tree for reproducibility
        if: matrix.python-version == '3.11'
        run: git archive --format=tar --prefix=interpersonal-strategist-source/ "$CANDIDATE_SHA" > build/source.tar

      - name: Smoke-test packaged layout
        run: python3 scripts/smoke_install.py --archive "dist/interpersonal-strategist-$(cat VERSION).zip"

      - name: Verify release checksum
        working-directory: dist
        run: shasum -a 256 -c "interpersonal-strategist-$(cat ../VERSION).zip.sha256"

      - name: Upload qualification-candidate artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interpersonal-strategist-${{ env.CANDIDATE_SHA }}
          if-no-files-found: error
          path: |
            dist/interpersonal-strategist-*.zip
            dist/interpersonal-strategist-*.zip.sha256
            dist/interpersonal-strategist-*.manifest.json
            build/interactive-skill/
            build/interactive-no-skill/
            build/skill-prompts.jsonl
            build/no-skill-prompts.jsonl
            build/persona-conversation-skill-prompts.jsonl
            build/persona-conversation-no-skill-prompts.jsonl
            build/relationship-scope-skill-prompts.jsonl
            build/relationship-scope-no-skill-prompts.jsonl
            build/build-provenance.json
            build/run-plan.json
            build/short-prompt.jsonl
            build/source.tar
            release/qualification.json
          retention-days: 30

  evidence-resolution:
    name: Online evidence identity resolution
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve promoted source identities
        run: python3 scripts/check_evidence.py --output evidence-resolution.json

      - name: Upload source-resolution report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-resolution-${{ github.sha }}
          if-no-files-found: error
          path: evidence-resolution.json
          retention-days: 90
