name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python3 -m compileall -q scripts evals tests

      - name: Validate repository and release governance
        run: python3 scripts/validate.py

      - name: Validate evidence registry offline
        run: python3 scripts/check_evidence.py --offline

      - name: Validate evaluation fixtures
        run: python3 evals/run.py validate-fixtures

      - name: Validate persona and conversation regression fixtures
        run: python3 evals/persona_conversation.py validate

      - name: Run unit and mutation tests
        run: python3 -m unittest discover -s tests -v

      - name: Prepare deterministic skill and no-skill manifests
        run: |
          mkdir -p build
          python3 evals/run.py prepare --condition skill --output build/skill-prompts.jsonl
          python3 evals/run.py prepare --condition no-skill --output build/no-skill-prompts.jsonl
          python3 evals/persona_conversation.py prepare \
            --condition skill \
            --output build/persona-conversation-skill-prompts.jsonl
          python3 evals/persona_conversation.py prepare \
            --condition no-skill \
            --output build/persona-conversation-no-skill-prompts.jsonl

      - name: Build deterministic release
        run: python3 scripts/package.py

      - name: Record exact-subject build provenance
        run: python3 scripts/build_provenance.py --output build/build-provenance.json

      - name: Snapshot exact source tree
        if: matrix.python-version == '3.11'
        run: git archive --format=zip --output=build/source-snapshot.zip HEAD

      - name: Smoke-test packaged layout
        run: python3 scripts/smoke_install.py --archive "dist/interpersonal-strategist-$(cat VERSION).zip"

      - name: Verify release checksum
        working-directory: dist
        run: shasum -a 256 -c "interpersonal-strategist-$(cat ../VERSION).zip.sha256"

      - name: Upload qualification-candidate artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interpersonal-strategist-${{ env.CANDIDATE_SHA }}
          if-no-files-found: error
          path: |
            dist/interpersonal-strategist-*.zip
            dist/interpersonal-strategist-*.zip.sha256
            dist/interpersonal-strategist-*.manifest.json
            build/skill-prompts.jsonl
            build/no-skill-prompts.jsonl
            build/persona-conversation-skill-prompts.jsonl
            build/persona-conversation-no-skill-prompts.jsonl
            build/build-provenance.json
            build/source-snapshot.zip
            release/qualification.json
          retention-days: 30

  apply-validated-scope-tree:
    name: Apply validated relationship-scope tree
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/broaden-relationship-scope' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out transfer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Reconstruct and verify validated object pack
        env:
          B64_SHA256: cbcbd9c06a2d3d75f501f6ab4c4e602d05692ee81cafe3646bbbf5d486b0a56f
          PACK_SHA256: b7ccc0a3b461817fe273728c6efe10090cf7420bed4ac3e8b20a63f6a2be734f
          TREE_SHA: 0e3ea035f954485c6e34e67a567254316c9bd37b
        run: |
          set -euo pipefail
          cat \
            .scope-pack.b64.00 \
            .scope-pack.b64.01 \
            .scope-pack.b64.02 \
            .scope-pack.b64.03 \
            .scope-pack.b64.04 \
            .scope-pack.b64.05 \
            .scope-pack.b64.06 \
            .scope-pack.b64.07 \
            > /tmp/scope.pack.b64
          echo "${B64_SHA256}  /tmp/scope.pack.b64" | sha256sum -c -
          base64 --decode /tmp/scope.pack.b64 > /tmp/scope.pack
          echo "${PACK_SHA256}  /tmp/scope.pack" | sha256sum -c -
          git index-pack --fix-thin --stdin < /tmp/scope.pack
          git cat-file -e "${TREE_SHA}^{tree}"

      - name: Publish validated tree while preserving registered workflows
        env:
          BRANCH: agent/broaden-relationship-scope
          TREE_SHA: 0e3ea035f954485c6e34e67a567254316c9bd37b
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          parent="$(git rev-parse HEAD)"
          git read-tree "${TREE_SHA}"
          for path in \
            .github/workflows/ci.yml \
            .github/workflows/apply-scope-tree.yml
          do
            entry="$(git ls-tree "${parent}" -- "${path}")"
            mode="$(printf '%s\n' "${entry}" | awk '{print $1}')"
            blob="$(printf '%s\n' "${entry}" | awk '{print $3}')"
            test -n "${mode}" && test -n "${blob}"
            git update-index --add --cacheinfo "${mode},${blob},${path}"
          done
          intermediate_tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'Expand interpersonal scope across relationships' \
            'Publish the validated non-workflow tree; the connected GitHub app will make the two permission-controlled workflow edits.' \
            | git commit-tree "${intermediate_tree}" -p "${parent}")"
          git reset --hard "${commit}"
          git push origin "${commit}:refs/heads/${BRANCH}"
          echo "Published ${commit} with intermediate tree ${intermediate_tree}"

  evidence-resolution:
    name: Online evidence identity resolution
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve promoted source identities
        run: python3 scripts/check_evidence.py --output evidence-resolution.json

      - name: Upload source-resolution report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-resolution-${{ github.sha }}
          if-no-files-found: error
          path: evidence-resolution.json
          retention-days: 90
