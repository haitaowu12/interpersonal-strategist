name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository
        run: python3 scripts/validate.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build deterministic release
        run: python3 scripts/package.py

      - name: Smoke-test packaged install
        run: python3 scripts/smoke_install.py --archive "dist/interpersonal-strategist-$(cat VERSION).zip"

      - name: Verify release checksum
        working-directory: dist
        run: shasum -a 256 -c "interpersonal-strategist-$(cat ../VERSION).zip.sha256"
